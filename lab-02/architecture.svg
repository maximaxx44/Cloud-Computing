<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="title desc">
<title id="title">TimeCapsule на Amazon EC2</title>
<desc id="desc">Рабочий компьютер отправляет код на GitHub и запускает деплой по SSH. EC2 скачивает код по HTTPS. Браузер обращается к nginx, который вызывает PHP-FPM. PHP подключается к PostgreSQL и сохраняет файлы на EBS.</desc>
