<title id="t">Хранение вложений TimeCapsule в Amazon S3</title><desc id="d">Браузер обращается к EC2 через Elastic IP; приложение проверяет права, получает временные данные IAM и отправляет операции с объектами в приватный S3. Скачивание идёт напрямую из S3 по подписанной ссылке.</desc>
